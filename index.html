<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pure Custom Creation POS</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" />
  <link rel="manifest" href="manifest.json" />
</head>
<body class="dark-mode">
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">PURE</div>
        <div class="brand-sub">CUSTOM CREATION</div>
        <h1 class="page-heading" id="pageHeading">Dashboard</h1>
        <div class="page-title" id="pageSubtitle">Today’s Business Snapshot</div>
      </div>
      <div class="theme-toggle glass">
        <div class="toggle-pill"></div>
        <button id="lightBtn" type="button" aria-label="Peony Blush theme"><i class="bi bi-brightness-high-fill"></i></button>
        <button id="darkBtn" type="button" aria-label="Dark mode"><i class="bi bi-moon-fill"></i></button>
      </div>
    </header>

    <main>
      <section class="tab-screen active-screen" id="dashboardScreen"></section>
      <section class="tab-screen" id="leadsScreen"></section>
      <section class="tab-screen" id="customersScreen"></section>
      <section class="tab-screen" id="cashScreen"></section>
      <section class="tab-screen" id="moreScreen"></section>
    </main>
  </div>

  <nav class="bottom-nav glass">
    <button class="nav-item active" type="button" data-tab="dashboard"><i class="bi bi-grid-1x2-fill"></i><span>Dashboard</span></button>
    <button class="nav-item" type="button" data-tab="leads"><i class="bi bi-megaphone"></i><span>Leads</span></button>
    <button class="nav-item" type="button" data-tab="customers"><i class="bi bi-people"></i><span>Customers</span></button>
    <button class="nav-item" type="button" data-tab="cash"><i class="bi bi-wallet2"></i><span>Cash Balance</span></button>
    <button class="nav-item" type="button" data-tab="more"><i class="bi bi-three-dots"></i><span>More</span></button>
  </nav>

  <div class="overlay hidden" id="appOverlay" role="dialog" aria-modal="true">
    <div class="panel glass" id="overlayPanel">
      <div id="overlayContent"></div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
  <script src="pdf-fix.js"></script>
</body>
</html>
