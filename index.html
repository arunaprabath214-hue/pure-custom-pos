<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <title>Pure POS | Pure Custom Creation</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="assets/logo.png" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="noise"></div>
  <aside class="side" id="side">
    <div class="brand">
      <img src="assets/logo.png" alt="Pure Custom Creation" />
      <span>Staff POS</span>
    </div>
    <nav id="nav"></nav>
    <button class="ghost full" id="seedBtn">Load demo data</button>
    <button class="ghost full danger" id="wipeBtn">Reset local data</button>
  </aside>

  <main class="app">
    <header class="topbar">
      <button class="icon" id="menuBtn">☰</button>
      <div>
        <p class="eyebrow">Pure Custom Creation</p>
        <h1 id="pageTitle">Dashboard</h1>
      </div>
      <div class="top-actions">
        <button class="chip" id="themeBtn">◐</button>
        <button class="chip" id="exportBtn">Export</button>
      </div>
    </header>

    <section class="content" id="content"></section>
  </main>

  <div class="toast" id="toast"></div>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
